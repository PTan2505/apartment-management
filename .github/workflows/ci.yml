name: CI

# Runs on everything that could become a release, and on the pull requests that
# get it there. `main` is what Render deploys, so a failure here is the last
# chance to catch something before it is live.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  # A newer commit on the same branch makes the older run irrelevant. Without
  # this, a burst of pushes queues up runs nobody will read.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck and build
    runs-on: ubuntu-latest
    # Deliberately not filtered by which paths changed. A rule that skips the
    # build on "documentation only" changes is a rule that will one day be
    # wrong about what counts as documentation, and the failure mode is a green
    # tick on something nobody checked. Two minutes is cheaper than that.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # The generated client lives in a gitignored directory, so nothing
      # compiles until this runs. It needs no database — it reads the schema.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # The frontend must have a Vietnamese sentence for every code this API can
      # return, and it proves that by typing its dictionary against a union
      # generated from here. That only works while the generated file is
      # current, so this regenerates it and fails if the committed copy differs.
      #
      # Without this the guarantee is only as good as somebody remembering to
      # run a script — which is the same as not having it.
      - name: Check the frontend's error codes are current
        run: npm run codes:check

      # Every multi-table write in this API is inside a transaction today, held
      # up by nobody forgetting. The failure that guards against is quiet — a
      # lease created whose occupant row was not — so it is checked rather than
      # remembered. The script says what it cannot see, and carries one
      # exemption with its reason.
      - name: Check multi-table writes are atomic
        run: npm run atomic:check

      # Compiles for real, which catches what `--noEmit` cannot: a path alias
      # `tsc-alias` fails to rewrite produces a build that type-checks and then
      # cannot find its own imports at runtime.
      - name: Build
        run: npm run build

      - name: Check the built server starts
        env:
          # No database is reached: the server binds its port before anything
          # queries. A URL that parses is all that is needed to get that far.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          JWT_SECRET: ci-only-not-a-real-secret
          PORT: 3999
        run: |
          node dist/server.js & pid=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3999/health > /dev/null; then
              echo "server answered /health"
              kill $pid
              exit 0
            fi
            sleep 1
          done
          echo "server did not answer /health within 20s"
          kill $pid || true
          exit 1

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    # Not filtered by changed paths, for the same reason the backend job is not:
    # a rule about what counts as "documentation only" is one that will
    # eventually be wrong, and its failure mode is a green tick on something
    # nobody checked.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` typechecks first, so this covers both.
      #
      # The address is a placeholder. Nothing here calls the API, and both
      # configs refuse to build without one — deliberately, so a bundle that
      # cannot reach its API is never produced. This job proves the build
      # WORKS; it does not test that refusal, which is a property of the config
      # and belongs where the config is verified.
      # One build now: the tenant portal is a route in this application rather
      # than a second bundle.
      - name: Build
        env:
          VITE_API_URL: https://ci.invalid
        run: npm run build

  specs:
    name: OpenSpec — validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Every archived change's requirements live in openspec/specs, and a
      # malformed delta merged by hand is invisible until somebody runs this.
      - name: Validate specs and changes
        run: npx --yes @fission-ai/openspec@1 validate --all --strict

name: Deploy

# Separate from CI on purpose.
#
# CI runs on `dev` and on pull requests, where deploying would be wrong.
# Expressing "only main, only after everything passed" as conditions inside
# that workflow would put a branch check on every job and spread the intent
# across the file. Here it is said once.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  # Two deploys of different commits racing would leave whichever finished last
  # in production, which is not necessarily the newer one.
  group: deploy-production
  cancel-in-progress: false

jobs:
  vercel:
    name: Owner application — Vercel
    runs-on: ubuntu-latest

    # Both halves matter. `workflow_run` fires when CI COMPLETES, which
    # includes completing in failure — without the conclusion check this would
    # deploy exactly the commits it exists to stop. The branch check is
    # belt-and-braces alongside the trigger's own filter.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    defaults:
      run:
        working-directory: frontend

    steps:
      # The commit CI actually tested, not whatever `main` points at now. They
      # differ whenever something lands while a run is in flight, and deploying
      # the newer one would ship code no run has passed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      # Pulls the project's settings so the build below matches what Vercel
      # would have produced itself.
      - name: Fetch Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Built HERE rather than by Vercel, so what ships is what CI checked.
      # Letting Vercel build would mean the same commit built twice, with two
      # chances to differ.
      #
      # VITE_API_URL is required — the build refuses without it, because a
      # bundle with no API address only fails at the first sign-in.
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
